# =============================================================================
# render.yaml — BugLens Backend (Infrastructure-as-Code)
#
# Docs: https://render.com/docs/yaml-spec
#
# Deploy: connect this repo in the Render dashboard — Render reads this file
# automatically.  Set all secret env vars in the Render dashboard under
# Environment → Secret Files/Vars. Never commit secrets here.
# =============================================================================

services:
  - type: web
    name: buglens-api
    runtime: python
    rootDir: backend

    # Install Python dependencies
    buildCommand: pip install -r requirements.txt

    # Render injects $PORT automatically; binding 0.0.0.0 is required.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    plan: free

    # Health-check endpoint
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

      # Replace with your actual Cloudflare Pages URL after deploy
      - key: ALLOWED_ORIGINS
        value: "https://buglens.pages.dev,http://localhost:5173"

      # ----------------------------------------------------------------
      # Secret variables — set these in the Render dashboard, NOT here
      # ----------------------------------------------------------------
      # MONGODB_URL                  = mongodb+srv://...
      # GEMINI_API_KEY               = AIzaSy...
      # OPENAI_API_KEY               = sk-...  (optional)
      # GITHUB_WEBHOOK_SECRET        = (any fallback secret)
      # GITHUB_ACCESS_TOKEN          = github_pat_...
      # FIREBASE_SERVICE_ACCOUNT_JSON = {"type": "service_account", ...}
